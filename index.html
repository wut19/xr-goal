<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f3f5">
<link rel="icon" href="data:,">
<title>放置任务</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #f2f3f5;
    color: #1f2328;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  }
  body.test { background: #fff4e6; }
  button {
    font: inherit; color: inherit; margin: 0; border: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .page {
    max-width: 560px; margin: 0 auto; padding: 10px 12px 96px;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .ep { font-size: 20px; font-weight: 600; white-space: nowrap; }
  .ep b { display: inline-block; margin: 0 6px; font-size: 34px; line-height: 1.1; color: #111; }
  .ep small { margin-left: 6px; font-size: 15px; font-weight: 400; color: #6e7781; }
  .gear { padding: 6px 12px; border-radius: 8px; background: #e1e4e8; font-size: 14px; }
  .meta { margin: 2px 0 0; font-size: 14px; color: #57606a; }
  .meta b { color: #1f2328; letter-spacing: 1px; }
  .tag {
    display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 6px;
    background: #dafbe1; color: #1a7f37; font-weight: 600;
  }
  .test .tag { background: #e8590c; color: #fff; }
  .hint { margin: 6px 0 8px; font-size: 15px; color: #3d434b; }

  .diagram { position: relative; border-radius: 12px; overflow: hidden; background: #d0d3d8; }
  .diagram .box { display: block; width: 100%; height: auto; }
  #markers { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  /* Markers are centred on (left, top); padding-bottom in % of width keeps them round. */
  .mk { position: absolute; height: 0; border-radius: 50%; }
  .mk.on { width: 17%; padding-bottom: 17%; margin: -8.5% 0 0 -8.5%; background: #fff; }
  .mk.on img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; }
  .mk.on b {
    position: absolute; left: -8px; top: -8px; width: 26px; height: 26px; line-height: 26px;
    border-radius: 50%; text-align: center; font-size: 16px; color: #fff; box-shadow: 0 0 0 2px #fff;
  }
  .mk.off {
    box-sizing: content-box; width: 9%; padding-bottom: 9%;
    margin: -4.5% 0 0 -4.5%; margin: calc(-4.5% - 2px) 0 0 calc(-4.5% - 2px);
    background: rgba(255, 255, 255, .7); border: 2px dashed #7d8590;
  }
  .mk.off span {
    position: absolute; left: 0; right: 0; top: 50%; margin-top: -.6em; line-height: 1.2em;
    text-align: center; font-size: 14px; font-weight: 700; color: #57606a;
  }

  .steps { list-style: none; margin: 10px 0 0; padding: 0; }
  .row {
    display: flex; align-items: center; margin-bottom: 5px; padding: 5px 12px 5px 8px;
    background: #fff; border-radius: 12px;
  }
  .row .num {
    flex: none; width: 28px; height: 28px; line-height: 28px; border-radius: 50%;
    text-align: center; font-size: 17px; color: #fff;
  }
  .row .thumb { flex: none; width: 36px; height: 36px; margin: 0 10px; border-radius: 8px; }
  .row .obj { flex: 1; font-size: 18px; font-weight: 600; }
  .row .arr { flex: none; margin: 0 8px; color: #8c959f; }
  .row .dst { flex: none; text-align: right; font-size: 18px; font-weight: 700; }

  .s1 .num, .mk.s1 b { background: #e03131; }
  .s2 .num, .mk.s2 b { background: #e8590c; }
  .s3 .num, .mk.s3 b { background: #2f9e44; }
  .s4 .num, .mk.s4 b { background: #7048e8; }
  .mk.on.s1 { box-shadow: 0 0 0 4px #e03131, 0 2px 8px rgba(0, 0, 0, .45); }
  .mk.on.s2 { box-shadow: 0 0 0 4px #e8590c, 0 2px 8px rgba(0, 0, 0, .45); }
  .mk.on.s3 { box-shadow: 0 0 0 4px #2f9e44, 0 2px 8px rgba(0, 0, 0, .45); }
  .mk.on.s4 { box-shadow: 0 0 0 4px #7048e8, 0 2px 8px rgba(0, 0, 0, .45); }

  .empty { margin: 4px 2px; font-size: 14px; color: #57606a; }
  .note { margin: 4px 2px; font-size: 13px; color: #8c959f; }
  .warn, .done { display: none; margin: 8px 0; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .warn { background: #fff1e5; color: #9a4b00; }
  .done { background: #dafbe1; color: #1a7f37; }
  .nojs { margin: 16px; padding: 12px; border-radius: 8px; background: #fff1e5; color: #9a4b00; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .97); box-shadow: 0 -1px 8px rgba(0, 0, 0, .12);
  }
  .bar-in, .row2 { display: flex; max-width: 560px; margin: 0 auto; }
  .btn { display: block; height: 52px; border-radius: 12px; font-size: 18px; font-weight: 700; }
  .btn.sec { flex: 1; margin-right: 10px; background: #e1e4e8; color: #1f2328; }
  .btn.pri { flex: 2; background: #1f6feb; color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:active { opacity: .8; }

  .modal {
    display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10;
    padding: 40px 16px; overflow-y: auto; background: rgba(0, 0, 0, .45);
  }
  .modal.show { display: block; }
  .sheet { max-width: 420px; margin: 0 auto; padding: 16px; border-radius: 14px; background: #fff; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .lead { margin: 0 0 12px; font-size: 15px; }
  .field { display: block; margin-bottom: 10px; font-size: 14px; color: #57606a; }
  .field input {
    display: block; width: 100%; height: 44px; margin-top: 4px; padding: 0 10px;
    border: 1px solid #c9ced6; border-radius: 10px; background: #fff; color: #1f2328;
    font: inherit; font-size: 18px; -webkit-appearance: none; appearance: none;
  }
  .err { min-height: 1.4em; margin: 0 0 6px; color: #d1242f; font-size: 14px; }
  .tip { margin: 0 0 6px; color: #6e7781; font-size: 13px; }
  .ranges { margin: 0 0 14px; padding: 0; list-style: none; }
  .ranges li { display: inline-block; width: 50%; }
  .ranges button { padding: 4px 0; background: none; color: #1f6feb; font-size: 14px; }
  .switch { display: block; margin: 16px 0 2px; text-align: center; color: #1f6feb; font-size: 14px; text-decoration: none; }

  @-webkit-keyframes pop { 0% { -webkit-transform: scale(1.5); color: #1f6feb; } 100% { -webkit-transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1.5); color: #1f6feb; } 100% { transform: scale(1); } }
  @-webkit-keyframes fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
  .swap #epNum { -webkit-animation: pop .5s ease-out; animation: pop .5s ease-out; }
  .swap #markers, .swap .steps { -webkit-animation: fadein .45s ease-out; animation: fadein .45s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .swap #epNum, .swap #markers, .swap .steps { -webkit-animation: none; animation: none; }
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <div class="ep">第<b id="epNum">-</b>条<small>/ <span id="epTotal">-</span></small></div>
    <button type="button" class="gear" id="btnSettings">设置</button>
  </div>
  <p class="meta"><span class="tag" id="tag">-</span>第 <span id="round">-</span> 轮 <span id="inRound">-</span> · 目标编号 <b id="code">-</b></p>
  <p class="hint">按 <b>1→2→3→4</b> 的顺序放进对应格子。</p>

  <div class="diagram">
    <img class="box" src="img/container.jpg" alt="容器俯视图">
    <div id="markers"></div>
  </div>

  <ol class="steps" id="steps"></ol>
  <p class="empty" id="empty"></p>
  <p class="done" id="done"></p>
  <p class="warn" id="saveWarn">这个浏览器无法保存进度，刷新后会回到第 1 条。请换用手机自带浏览器，或在「设置」里手动填回条数。</p>
  <p class="note" id="note"></p>
</div>

<div class="bar">
  <div class="bar-in">
    <button type="button" class="btn sec" id="btnPrev">上一条</button>
    <button type="button" class="btn pri" id="btnNext">下一条</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="setTitle">设置</h2>
    <p class="lead" id="firstTip">第一次打开，请确认从第几条开始。一个人采集就从第 1 条开始；多人同时采集时，每人从自己负责范围的第一条开始。</p>
    <label class="field">当前条数（1–<span id="maxEp">-</span>）
      <input id="inEp" type="number" inputmode="numeric" pattern="[0-9]*" min="1">
    </label>
    <p class="err" id="err"></p>
    <p class="tip" id="planTip"></p>
    <ul class="ranges" id="ranges"></ul>
    <div class="row2">
      <button type="button" class="btn sec" id="btnCancel">取消</button>
      <button type="button" class="btn pri" id="btnSave">保存</button>
    </div>
    <a class="switch" id="switchLink" href="./">-</a>
  </div>
</div>

<noscript><p class="nojs">请开启浏览器的 JavaScript 后刷新页面。</p></noscript>
<script src="goal.js?v=3"></script>
<script>
(function () {
  'use strict';
  var G = window.GoalGen;

  function $(id) { return document.getElementById(id); }

  if (!G || G.VERSION !== 3) {
    $('steps').innerHTML = '<li class="row">页面没有加载完整，请刷新。</li>';
    return;
  }

  // Split comes from the URL: ./ = train, ./?split=test = test.
  var SPLIT = /(^|&)split=test(&|$)/.test(window.location.search.slice(1)) ? 'test' : 'train';
  var IS_TEST = SPLIT === 'test';
  var KIND = IS_TEST ? '测试' : '训练';
  var INFO = G.SPLITS[SPLIT];
  var TOTAL = INFO.total;
  var ROUND = INFO.roundSize;
  var KEY = IS_TEST ? 'xr_icl_goal_v2_test' : 'xr_icl_goal_v2'; // progress is kept per split
  var canSave = true;

  function load() {
    try {
      var s = JSON.parse(window.localStorage.getItem(KEY) || 'null');
      if (s && G.isValidEpisode(SPLIT, s.ep)) return { ep: s.ep };
    } catch (e) { /* storage unavailable or corrupt: start fresh */ }
    return null;
  }

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
      canSave = true;
    } catch (e) {
      canSave = false;
    }
  }

  var saved = load();
  var state = saved || { ep: 1 };
  save();

  document.title = '放置任务 · ' + KIND + '目标';
  if (IS_TEST) {
    document.body.className = 'test';
    var themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) themeColor.setAttribute('content', '#fff4e6');
  }
  $('tag').textContent = KIND + '集';
  $('epTotal').textContent = String(TOTAL);
  $('maxEp').textContent = String(TOTAL);
  $('note').textContent = (IS_TEST ? '这是测试集，录制时请标明是测试数据。' : '') +
    '每条做好后再点「下一条」。做失败了就重做本条，不要跳过。';
  $('done').textContent = '这是最后一条。全部做完后，每个' + KIND + '目标正好有 ' + INFO.repeats + ' 条示范。';
  $('planTip').textContent = '共 ' + INFO.goals + ' 个' + KIND + '目标，每个做 ' + INFO.repeats + ' 次，分 ' +
    INFO.repeats + ' 轮，每轮把所有' + KIND + '目标各做一次。多人同时采集时，每人负责不同的范围，' +
    '例如按轮分（点一下填入起始条数）：';
  var ranges = [];
  for (var r = 1; r <= INFO.repeats; r++) {
    ranges.push('<li><button type="button" data-ep="' + ((r - 1) * ROUND + 1) + '">第 ' + r + ' 轮：' +
      ((r - 1) * ROUND + 1) + '–' + (r * ROUND) + '</button></li>');
  }
  $('ranges').innerHTML = ranges.join('');
  $('switchLink').href = window.location.pathname + (IS_TEST ? '' : '?split=test');
  $('switchLink').textContent = IS_TEST ? '切换到训练集' : '切换到测试集（进度分开记录）';

  function render(animate) {
    var g = G.getEpisode(SPLIT, state.ep);
    var used = {}, mk = [], rows = [], empty = [];
    var i, st, h, p;

    for (i = 0; i < g.steps.length; i++) {
      st = g.steps[i];
      used[st.hole.id] = true;
      mk.push('<div class="mk on s' + st.step + '" style="left:' + st.hole.x + '%;top:' + st.hole.y + '%">' +
        '<img src="' + st.object.img + '" alt="' + st.object.name + '"><b>' + st.step + '</b></div>');
      rows.push('<li class="row s' + st.step + '">' +
        '<b class="num">' + st.step + '</b>' +
        '<img class="thumb" src="' + st.object.img + '" alt="">' +
        '<span class="obj">' + st.object.name + '</span>' +
        '<span class="arr">→</span>' +
        '<span class="dst">' + st.hole.name + '</span>' +
        '</li>');
    }
    for (i = 0; i < G.HOLES.length; i++) {
      h = G.HOLES[i];
      if (!used[h.id]) {
        mk.push('<div class="mk off" style="left:' + h.x + '%;top:' + h.y + '%"><span>空</span></div>');
      }
    }
    for (i = 0; i < g.emptyHoles.length; i++) empty.push(g.emptyHoles[i].name);

    $('epNum').textContent = String(g.episode);
    $('round').textContent = String(g.round);
    $('inRound').textContent = g.indexInRound + '/' + ROUND;
    $('code').textContent = g.code;
    $('markers').innerHTML = mk.join('');
    $('steps').innerHTML = rows.join('');
    $('empty').textContent = '标「空」的格子不放东西：' + empty.join('、');
    $('done').style.display = state.ep === TOTAL ? 'block' : 'none';
    $('btnPrev').disabled = state.ep <= 1;
    $('btnNext').disabled = state.ep >= TOTAL;
    $('saveWarn').style.display = canSave ? 'none' : 'block';

    if (animate) {
      p = $('page');
      p.className = 'page';
      void p.offsetWidth; // restart the CSS animations
      p.className = 'page swap';
    }
  }

  var busy = false; // ignore accidental double taps

  function go(delta) {
    var n = state.ep + delta;
    if (busy || !G.isValidEpisode(SPLIT, n)) return;
    busy = true;
    setTimeout(function () { busy = false; }, 400);
    state.ep = n;
    save();
    render(true);
    window.scrollTo(0, 0);
  }

  $('btnNext').onclick = function () { go(1); };
  $('btnPrev').onclick = function () { go(-1); };

  var modal = $('modal');

  function openSettings(first) {
    $('setTitle').textContent = (IS_TEST ? '测试集：' : '') + (first ? '从第几条开始？' : '设置');
    $('firstTip').style.display = first ? 'block' : 'none';
    $('inEp').value = String(state.ep);
    $('err').textContent = '';
    modal.className = 'modal show';
  }

  function closeSettings() { modal.className = 'modal'; }

  function saveSettings() {
    var raw = String($('inEp').value).trim();
    var e = /^[0-9]+$/.test(raw) ? Number(raw) : NaN;
    if (!G.isValidEpisode(SPLIT, e)) {
      $('err').textContent = '条数必须是 1 到 ' + TOTAL + ' 之间的整数。';
      return;
    }
    var changed = e !== state.ep;
    state.ep = e;
    save();
    closeSettings();
    render(changed);
  }

  $('btnSettings').onclick = function () { openSettings(false); };
  $('btnCancel').onclick = closeSettings;
  $('btnSave').onclick = saveSettings;
  $('inEp').onkeydown = function (ev) { if (ev.keyCode === 13) saveSettings(); };
  modal.onclick = function (ev) { if (ev.target === modal) closeSettings(); };
  $('ranges').onclick = function (ev) {
    var t = ev.target || ev.srcElement;
    var v = t && t.getAttribute ? t.getAttribute('data-ep') : null;
    if (v) {
      $('inEp').value = v;
      $('err').textContent = '';
    }
  };

  render(false);
  if (!saved) openSettings(true);
})();
</script>
</body>
</html>
